# ============================================================
# HYWorld — docker-compose.yml
# ============================================================

services:
  hyworld:
    image: hyworld_ml:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyworld_ml
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - C:/HyWorldWebData:/c/HyWorldWebData
      # MODELS_DIR viene de C:/HyWorldWebData/.env (start.bat lo exporta)
      - ${MODELS_DIR:-C:/HyWorldWebData/models}:/c/HyWorldWebData/models
      - .:/workspace/scripts
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      # expandable_segments rompe en WSL2 + offload de accelerate (HY-Pano):
      # "device not ready" / "!handles_.at(i) INTERNAL ASSERT" en el allocator.
      # max_split_size_mb reduce fragmentacion sin ese fallo.
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
      - HYWORLD_DIR=/c/HyWorldWebData/repo
      - PROJECTS_DIR=/c/HyWorldWebData/projects
      - LOGS_DIR=/c/HyWorldWebData/logs
      - PYTHONPATH=/c/HyWorldWebData/repo/hyworld2/panogen:/c/HyWorldWebData/repo
      # Modelos HuggingFace → volumen persistente (evita re-descarga en cada arranque)
      - HF_HOME=/c/HyWorldWebData/models
      - HUGGINGFACE_HUB_CACHE=/c/HyWorldWebData/models/hub
      - TRANSFORMERS_CACHE=/c/HyWorldWebData/models/hub
      # Asset server (Hunyuan3D-2 corriendo en Windows host)
      - ASSET_SERVER_URL=http://host.docker.internal:8081
      # Token HuggingFace — viene de C:/HyWorldWebData/.env (start.bat lo exporta)
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3.11", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s