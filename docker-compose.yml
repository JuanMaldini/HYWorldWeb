# ============================================================
# HYWorld — docker-compose.yml
# ============================================================

services:
  hyworld:
    image: hyworld_ml:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyworld_ml
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "5173:5173"
    volumes:
      - C:/HyWorldWebData:/c/HyWorldWebData
      - ./scripts:/workspace/scripts
    env_file:
      - C:/HyWorldWebData/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HYWORLD_DIR=/c/HyWorldWebData/repo
      - PROJECTS_DIR=/c/HyWorldWebData/projects
      - LOGS_DIR=/c/HyWorldWebData/logs
      - PYTHONPATH=/c/HyWorldWebData/repo/hyworld2/panogen:/c/HyWorldWebData/repo
      # Modelos HuggingFace → volumen persistente (evita re-descarga en cada arranque)
      - HF_HOME=/c/HyWorldWebData/models
      - HUGGINGFACE_HUB_CACHE=/c/HyWorldWebData/models/hub
      - TRANSFORMERS_CACHE=/c/HyWorldWebData/models/hub
      # Asset server (Hunyuan3D-2 corriendo en Windows host)
      - ASSET_SERVER_URL=http://host.docker.internal:8081
    healthcheck:
      test: ["CMD", "python3.11", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s