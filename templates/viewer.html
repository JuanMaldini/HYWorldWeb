<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ meta.name }} - HYWorld Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .topbar {
    background: #12121a;
    border-bottom: 1px solid #1e1e2e;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar a {
    color: #7c3aed;
    text-decoration: none;
    font-size: 20px;
  }
  .topbar h1 {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
  }
  .status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .status-pending { background: #1a1a24; color: #666; }
  .status-processing { background: #1a1500; color: #ca8a04; }
  .status-completed { background: #0a1a0a; color: #22c55e; }
  
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 56px);
  }
  
  /* Sidebar */
  .sidebar {
    background: #12121a;
    border-right: 1px solid #1e1e2e;
    overflow-y: auto;
    padding: 20px;
  }
  .section-title {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  
  .upload-area {
    border: 2px dashed #2a2a3a;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }
  .upload-area:hover { border-color: #7c3aed50; }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-text { font-size: 12px; color: #555; }
  .upload-text span { color: #7c3aed; }
  #fileInput { display: none; }
  
  .btn {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
  }
  .btn:hover { background: #6d28d9; }
  .btn:disabled { background: #2a2a3a; color: #555; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid #2a2a3a; color: #888; margin-top: 8px; }
  .btn-outline:hover { border-color: #7c3aed; color: #7c3aed; }
  
  .image-list { display: flex; flex-direction: column; gap: 8px; }
  .image-thumb {
    border-radius: 8px;
    overflow: hidden;
    height: 80px;
    background: #1a1a24;
    border: 1px solid #1e1e2e;
  }
  .image-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  /* Main viewer */
  .viewer-main {
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #canvas-container {
    flex: 1;
    position: relative;
  }
  #viewer-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  
  .viewer-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
    pointer-events: none;
  }
  .viewer-placeholder .icon { font-size: 64px; margin-bottom: 16px; }
  .viewer-placeholder .text { font-size: 16px; }
  .viewer-placeholder .sub { font-size: 13px; color: #444; margin-top: 4px; }
  
  /* Toolbar overlay */
  .viewer-toolbar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: #12121acc;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 8px;
    backdrop-filter: blur(8px);
  }
  .toolbar-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: #888;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .toolbar-btn:hover { background: #1e1e2e; color: #fff; }
  .toolbar-btn.active { background: #7c3aed30; color: #7c3aed; }
  
  /* Loading overlay */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,15,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #2a2a3a;
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Progress bar */
  .progress-bar {
    width: 300px;
    height: 4px;
    background: #1e1e2e;
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="/dashboard">←</a>
  <h1>{{ meta.name }}</h1>
  <span class="status-badge status-{{ meta.status }}">{{ meta.status }}</span>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="section-title">Input Images</div>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📤</div>
      <div class="upload-text">Drop images or <span>browse</span></div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" onchange="uploadImages(this.files)">
    
    <div class="image-list" id="imageList">
      {% for img in input_images %}
      <div class="image-thumb">
        <img src="{{ img }}" alt="input">
      </div>
      {% endfor %}
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn" id="triggerBtn" onclick="triggerProcessing()"
        {% if meta.status == 'completed' or meta.status == 'processing' %}disabled{% endif %}>
        🚀 Process
      </button>
      <button class="btn btn-outline" onclick="refreshStatus()">↻ Refresh</button>
    </div>
  </div>
  
  <!-- 3D Viewer -->
  <div class="viewer-main">
    <div id="canvas-container">
      <canvas id="viewer-canvas"></canvas>
      <div class="viewer-placeholder" id="viewerPlaceholder">
        {% if meta.status == 'completed' %}
        <div class="icon">🌍</div>
        <div class="text">3D Reconstruction Ready</div>
        <div class="sub">Click to load viewer</div>
        {% else %}
        <div class="icon">⏳</div>
        <div class="text">Awaiting Processing</div>
        <div class="sub">Upload images and click Process</div>
        {% endif %}
      </div>
    </div>
    
    <div class="viewer-toolbar">
      <button class="toolbar-btn active" onclick="setRotation(0)" title="Front">▶</button>
      <button class="toolbar-btn" onclick="setRotation(1)" title="Top">▲</button>
      <button class="toolbar-btn" onclick="toggleWireframe()" title="Wireframe">◇</button>
      <button class="toolbar-btn" onclick="resetCamera()" title="Reset">⟲</button>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText">Loading model...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ─── Three.js Viewer Setup ─────────────────────────────
const canvas = document.getElementById('viewer-canvas');
const container = document.getElementById('canvas-container');

// Renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0a0a0f, 1);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

// Camera
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);
camera.position.set(0, 0, 3);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.1;
controls.maxDistance = 50;

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const directional = new THREE.DirectionalLight(0xffffff, 1);
directional.position.set(5, 10, 5);
scene.add(directional);

// Grid
const gridHelper = new THREE.GridHelper(10, 20, 0x222222, 0x181818);
scene.add(gridHelper);

// State
let loadedMesh = null;
let wireframeMode = false;

// Resize
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Load PLY/OBJ/GLTF
async function loadModel(url) {
  showLoading('Loading 3D model...');
  // Try to detect file type from extension
  const ext = url.split('.').pop().toLowerCase();
  try {
    if (ext === 'ply') {
      // PLY using basic Three.js loader
      const response = await fetch(url);
      const text = await response.text();
      parsePLY(text);
    } else if (ext === 'obj') {
      const response = await fetch(url);
      const text = await response.text();
      parseOBJ(text);
    } else if (ext === 'glb' || ext === 'gltf') {
      // Use GLTFLoader if available via CDN
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js';
      script.onload = async () => {
        const loader = new THREE.GLTFLoader();
        const gltf = await loader.loadAsync(url);
        setMesh(gltf.scene);
        hideLoading();
      };
      document.head.appendChild(script);
      return;
    }
    hideLoading();
  } catch (e) {
    console.error('Load error:', e);
    hideLoading();
    showLoading('Error loading model');
  }
}

function parsePLY(text) {
  const lines = text.split('\n');
  let vertices = [];
  let faces = [];
  let readingVertices = false;
  let readingFaces = false;
  
  for (const line of lines) {
    if (line.startsWith('end_header')) { readingVertices = true; continue; }
    if (line.startsWith('property')) continue;
    if (readingVertices && !readingFaces) {
      const parts = line.trim().split(/\s+/);
      if (parts.length >= 3) {
        vertices.push(parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2]));
      } else { readingFaces = true; }
    }
    if (readingFaces) {
      const parts = line.trim().split(/\s+/);
      if (parts.length >= 3) {
        faces.push(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
      }
    }
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(faces);
  geometry.computeVertexNormals();
  
  const material = new THREE.MeshStandardMaterial({ color: 0x8866cc, roughness: 0.7, metalness: 0.1 });
  const mesh = new THREE.Mesh(geometry, material);
  setMesh(mesh);
}

function parseOBJ(text) {
  const vertices = [];
  const faces = [];
  for (const line of text.split('\n')) {
    if (line.startsWith('v ')) {
      const parts = line.split(' ').slice(1).map(parseFloat);
      vertices.push(parts[0], parts[1], parts[2]);
    }
    if (line.startsWith('f ')) {
      const parts = line.split(' ').slice(1).map(p => parseInt(p.split('/')[0]) - 1);
      faces.push(...parts);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(faces);
  geometry.computeVertexNormals();
  const material = new THREE.MeshStandardMaterial({ color: 0x8866cc, roughness: 0.7, metalness: 0.1 });
  setMesh(new THREE.Mesh(geometry, material));
}

function setMesh(mesh) {
  if (loadedMesh) scene.remove(loadedMesh);
  loadedMesh = mesh;
  // Center mesh
  const box = new THREE.Box3().setFromObject(mesh);
  const center = box.getCenter(new THREE.Vector3());
  mesh.position.sub(center);
  const size = box.getSize(new THREE.Vector3()).length();
  camera.position.set(0, 0, size * 2);
  controls.update();
  scene.add(mesh);
  document.getElementById('viewerPlaceholder').style.display = 'none';
}

// Toolbar actions
function setRotation(view) {
  if (!loadedMesh) return;
  const time = 0.5;
  if (view === 0) {
    gsapTo(loadedMesh.rotation, { x: 0, y: 0, z: 0 }, time);
    gsapTo(camera.position, { x: 0, y: 0, z: 3 }, time);
  } else if (view === 1) {
    gsapTo(loadedMesh.rotation, { x: -Math.PI/2, y: 0, z: 0 }, time);
    gsapTo(camera.position, { x: 0, y: 0, z: 3 }, time);
  }
}
function toggleWireframe() {
  wireframeMode = !wireframeMode;
  if (loadedMesh) {
    loadedMesh.material.wireframe = wireframeMode;
  }
}
function resetCamera() {
  camera.position.set(0, 0, 3);
  if (loadedMesh) {
    const box = new THREE.Box3().setFromObject(loadedMesh);
    const size = box.getSize(new THREE.Vector3()).length();
    camera.position.z = size * 2;
  }
  controls.reset();
}

// Simple animation helper
function gsapTo(obj, target, duration) {
  const start = {};
  for (const key in target) start[key] = obj[key];
  const startTime = performance.now();
  function step(now) {
    const t = Math.min((now - startTime) / (duration * 1000), 1);
    const ease = 1 - Math.pow(1 - t, 3);
    for (const key in target) obj[key] = start[key] + (target[key] - start[key]) * ease;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Loading overlay
function showLoading(text) {
  document.getElementById('loadingOverlay').classList.add('active');
  document.getElementById('loadingText').textContent = text;
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

// Upload images
async function uploadImages(files) {
  if (!files.length) return;
  showLoading('Uploading images...');
  const formData = new FormData();
  for (const f of files) formData.append('images', f);
  
  const r = await fetch('/project/{{ pid }}/upload', { method: 'POST', body: formData });
  const data = await r.json();
  
  // Add thumbnails
  for (const fname of data.files) {
    const div = document.createElement('div');
    div.className = 'image-thumb';
    div.innerHTML = `<img src="/projects/{{ pid }}/input/${fname}" alt="${fname}">`;
    document.getElementById('imageList').appendChild(div);
  }
  hideLoading();
}

// Trigger processing
async function triggerProcessing() {
  const r = await fetch('/project/{{ pid }}/trigger', { method: 'POST' });
  const data = await r.json();
  document.getElementById('triggerBtn').disabled = true;
  document.getElementById('triggerBtn').textContent = '⏳ Processing...';
}

// Refresh status
async function refreshStatus() {
  const r = await fetch('/project/{{ pid }}/refresh', { method: 'POST' });
  const data = await r.json();
  if (data.status === 'completed') {
    location.reload();
  }
}

// Auto-refresh status
setInterval(async () => {
  const r = await fetch('/project/{{ pid }}/refresh', { method: 'POST' });
  const data = await r.json();
}, 30000);
</script>
</body>
</html>
