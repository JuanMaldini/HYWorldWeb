<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYWorld - Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #12121a;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    color: #7c3aed;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .logo span { color: #a78bfa; }
  .subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 36px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%;
    background: #1a1a24;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 12px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #7c3aed; }
  .btn {
    width: 100%;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #6d28d9; }
  .btn:active { transform: scale(0.98); }
  .error {
    background: #1e0a0a;
    border: 1px solid #7c3aed33;
    border-radius: 8px;
    padding: 12px;
    color: #f87171;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #444;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">HY<span>World</span></div>
  <div class="subtitle">3D World Reconstruction Platform</div>
  
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  
  <form method="POST">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="your@email.com" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
  
  <div class="footer">HYWorld v2.0 — Dev Mode</div>
</div>
</body>
</html>
